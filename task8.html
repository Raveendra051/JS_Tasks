//Task 4:Product Image Gallery

<div id="gallery"></div>

<script>
fetch("https://fakestoreapi.com/products")
  .then(res => res.json())
  .then(data => {
    const gallery = document.querySelector("#gallery");

    data.forEach(product => {
      const img = document.createElement("img");
      img.src = product.image;
      img.alt = product.title;
      img.width = 150;

      gallery.append(img);
    });
  });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complete Product Cards</title>
  <style>
    /* CSS Grid added to the container */
    #main-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 16px;
    }

    .card {
      border: 1px solid #ccc;
      padding: 16px;
      border-radius: 8px;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img {
      max-width: 100%;
      height: 150px;
      object-fit: contain;
      margin: 0 auto 12px;
    }

    .card button {
      cursor: pointer;
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }

    .card button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div id="main-container"></div>

  <script>
    fetch("https://fakestoreapi.com/products")
      .then(response => response.json())
      .then(products => {
        const mainContainer = document.querySelector("#main-container");

        products.forEach(c => {
          const card = document.createElement("div");
          card.className = "card";

          card.innerHTML = `
            <img src="${c.image}" alt="${c.title}">
            <h3>Title: ${c.title}</h3>
            <p><strong>Category:</strong> ${c.category}</p>
            <p><strong>Description:</strong><br>${c.description}</p>
            <p><strong>Price:</strong> $${c.price}</p>
            <p><strong>Rating:</strong> ${c.rating.rate}</p>
            <p><strong>Reviews:</strong> ${c.rating.count}</p>
            <button>BUY NOW</button>
          `;

          mainContainer.append(card);
        });
      });
  </script>

</body>
</html>
